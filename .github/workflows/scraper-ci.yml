name: scraper CI

on:
  push:
    branches: [master, main]
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-ci.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-ci.yml"

defaults:
  run:
    working-directory: scraper

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: scraper/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test -race ./...
