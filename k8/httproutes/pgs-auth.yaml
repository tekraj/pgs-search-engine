# Sign-in and sign-up endpoints: their own routes so a controller can rate-limit them
# harder than search (nginx did this with its `login` zone, 5 requests/minute per client).
# Rate limiting is not part of the Gateway API; see gateways/envoy-rate-limit.yaml.
# These are exact paths, so they win over the prefix routes in pgs-api / pgs-ui.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgs-auth
  labels:
    app.kubernetes.io/name: pgs-gateway
spec:
  parentRefs:
    - name: pgs
  rules:
    # The API's own endpoints (reachable directly, so limited too).
    - matches:
        - path: { type: Exact, value: /api/v1/auth/login }
        - path: { type: Exact, value: /api/v1/account/login }
        - path: { type: Exact, value: /api/v1/account/register }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
              - { name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=()" }
              - name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://localboundries.oknp.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      backendRefs:
        - name: api
          port: 8000
    # The UI's routes that forward to them.
    - matches:
        - path: { type: Exact, value: /api/auth/login }
        - path: { type: Exact, value: /api/account/login }
        - path: { type: Exact, value: /api/account/register }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
              - { name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=()" }
              - name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://localboundries.oknp.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      backendRefs:
        - name: ui
          port: 3000
